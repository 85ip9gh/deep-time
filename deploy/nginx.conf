# Serves the static pool as a non-root uid on a read-only root filesystem, which
# is what the apps-namespace hardening requires. Two things follow from that and
# neither is optional: the listen port is 8080 because a non-root process cannot
# bind 80, and every writable path is forced under /tmp because that is the one
# emptyDir the Deployment mounts. A stock nginx.conf writes its pid and caches
# under /var and would fail to start here.
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    sendfile on;
    gzip on;
    gzip_types application/json application/javascript text/css;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Probes hit this rather than / so a readiness check is answering a
        # question about the server, not paying to gzip the page.
        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # scenes.json is regenerated out of band and swapped in by a new image,
        # so a short cache is safe and keeps repeat draws off the disk.
        location = /scenes.json {
            add_header Cache-Control "public, max-age=300";
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
