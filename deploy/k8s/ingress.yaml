# Plain networking.k8s.io Ingress so the routing is portable and only the
# rate-limit middleware is provider-specific.
#
# No TLS block, by design: Cloudflare terminates TLS at its edge and cloudflared
# carries plaintext HTTP to Traefik's `web` entrypoint inside the host netns; the
# `websecure` entrypoint is not exposed.
#
# Change the host to whatever DNS name you point at the tunnel for this site.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deep-time
  namespace: apps
  labels:
    app.kubernetes.io/name: deep-time
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: apps-deep-time-ratelimit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: deeptime.pesanth.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deep-time
                port:
                  name: http
