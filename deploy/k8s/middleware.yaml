# A static GET is cheap, but the box also serves several other public sites, so
# an unmetered flood here still steals CPU and bandwidth from them. The limit is
# looser than an endpoint that runs code would use.
#
# The source is `Cf-Connecting-Ip`, not the connecting address: every request
# arrives from cloudflared on the host, so Traefik's default per-client-IP
# criterion would see one source for the entire internet. Cloudflare sets this
# header at its edge and overwrites anything the client sent, and the tunnel is
# the only route in, so it cannot be forged from outside.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: deep-time-ratelimit
  namespace: apps
spec:
  rateLimit:
    average: 60
    period: 1m
    burst: 40
    sourceCriterion:
      requestHeaderName: Cf-Connecting-Ip
